# ============================================
# Legacy Compose (保留历史链路，不作为默认入口)
#
# 本文件用于旧版 Streamlit + legacy API 的 HTTPS 代理实验。
# 默认开发和部署请使用 docker-compose.yml（Backend + React）。
# ============================================

services:
  backend:
    build: .
    container_name: autoftir-legacy-backend
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 9000
    expose:
      - "9000"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openai_compat}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_DEBUG=${AI_DEBUG:-0}
      - HOST=0.0.0.0
      - PORT=9000
    volumes:
      - ./api:/app/api:ro
      - ./core:/app/core:ro
      - ./modules:/app/modules:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: .
    container_name: autoftir-legacy-frontend
    command: python -m streamlit run frontend/streamlit_app.py --server.address=0.0.0.0 --server.port=9501
    expose:
      - "9501"
    environment:
      - FTIR_BACKEND_URL=http://backend:9000
    volumes:
      - ./frontend:/app/frontend:ro
      - ./core:/app/core:ro
      - ./templates:/app/templates:ro
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: autoftir-legacy-nginx
    ports:
      - "9080:9080"
      - "9443:9443"
    volumes:
      - ./nginx/default.conf.https:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
